version: '3.8'

networks:
  mall-net:
    driver: bridge

services:

  # ========== 1. MySQL ==========
  mysql:
    image: mysql:8.0
    container_name: mysql
    networks:
      - mall-net
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - TZ=Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --max_connections=500
    volumes:
      - ./data/mysql/data:/var/lib/mysql
      - ./data/mysql/logs:/var/log/mysql
      - ./conf/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========== 2. Nacos ==========
  nacos:
    image: nacos/nacos-server:2.2.3
    container_name: nacos
    networks:
      - mall-net
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      - MODE=standalone
      - JVM_XMS=512m
      - JVM_XMX=512m
      - PREFER_HOST_MODE=hostname
      - MYSQL_SERVICE_HOST=mysql
      - MYSQL_SERVICE_DB_NAME=mall_user
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=root
    volumes:
      - ./data/nacos/logs:/home/nacos/logs
      - ./data/nacos/data:/home/nacos/data
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # ========== 3. Redis ==========
  redis:
    image: redis:7.2
    container_name: redis
    networks:
      - mall-net
    ports:
      - "6379:6379"
    command: redis-server --requirepass ""
    volumes:
      - ./data/redis:/data
    restart: unless-stopped

  # ========== 4. RocketMQ ==========
  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: rocketmq-namesrv
    networks:
      - mall-net
    ports:
      - "9876:9876"
    environment:
      - JAVA_OPT_EXT=-server -Xms256m -Xmx256m
    command: sh mqnamesrv
    volumes:
      - ./data/rocketmq/namesrv/logs:/home/rocketmq/logs
    restart: unless-stopped

  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: rocketmq-broker
    networks:
      - mall-net
    ports:
      - "10911:10911"
      - "10909:10909"
    environment:
      - JAVA_OPT_EXT=-server -Xms1g -Xmx1g
      - NAMESRV_ADDR=rocketmq-namesrv:9876
    command: sh mqbroker -c /home/rocketmq/conf/broker.conf
    depends_on:
      - rocketmq-namesrv
    volumes:
      - ./data/rocketmq/broker/logs:/home/rocketmq/logs
      - ./data/rocketmq/broker/store:/home/rocketmq/store
      - ./conf/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf
    restart: unless-stopped

  # ========== 5. Seata Server ==========
  seata-server:
    image: seataio/seata-server:2.0.0
    container_name: seata-server
    networks:
      - mall-net
    ports:
      - "8091:8091"
    environment:
      - SEATA_IP=seata-server
      - SEATA_PORT=8091
      - JVM_XMS=512m
      - JVM_XMX=512m
    volumes:
      - ./data/seata/logs:/root/logs
    restart: unless-stopped

  # ========== 6. XXL-Job Admin ==========
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.4.2
    container_name: xxl-job-admin
    networks:
      - mall-net
    ports:
      - "8100:8100"
    environment:
      - PARAMS=--server.port=8100 \
              --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai \
              --spring.datasource.username=root \
              --spring.datasource.password=root \
              --xxl.job.accessToken=default_token
    volumes:
      - ./data/xxl-job/logs:/data/applogs/xxl-job
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
